name: bouh_radar_gps_pro
description: BOUH RADAR GPS PRO v25 - نظام رادار ذهب احترافي بـ GPS وتحليل AI جيولوجي متقدم
publish_to: 'none'
version: 25.0.0+25

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Maps & GPS
  geolocator: ^9.0.2
  geocoding: ^2.1.0
  latlong2: ^0.9.1
  flutter_map: ^6.1.0
  
  # UI & Design
  material_design_icons_flutter: ^7.0.7296
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.0
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Data Processing
  charts_flutter: ^0.12.0
  
  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.4.4
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/
    - assets/icons/
    - assets/images/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
